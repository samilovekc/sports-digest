name: daily-digest
on:
  schedule:
    - cron: "0 22 * * *"
    - cron: "0 6 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: digest
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python digest.py
      - name: Commit
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add -A docs
          git diff --cached --quiet || git commit -m "digest $(TZ=Asia/Taipei date +'%F %H:%M')"
          git pull --rebase -q || true
          git push
